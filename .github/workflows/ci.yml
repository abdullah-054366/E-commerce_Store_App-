#1_name
name: CI

#2_events
on:
  push:
      branches:
        - main
  pull_request:
      branches:
        - main      
#3_jobs

jobs:
  build:
     name: Build
     runs-on: ubuntu-latest

     steps:

        - name: setup node
          uses: actions/setup-node@v3
          with:
            node-version: '24'
            
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Install dependencies
          run: npm ci

        - name: Run lint
          run: npm run lint

        - name: Build project 
          run: npm run build
